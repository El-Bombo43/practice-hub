[package]
name = "headroom"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Headroom: a mastering meter (LUFS and true peak) with a collapsible window"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", default-features = false, features = ["vst3"] }
nih_plug_egui = { path = "../../vendor/nih_plug_egui" }
phub_common = { path = "../../shared/common" }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
png = "0.17"
