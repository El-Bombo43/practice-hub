[package]
name = "contour"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Contour: a mixing EQ with a Pro-Q-style workflow and per-band dynamic EQ"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", default-features = false, features = ["vst3"] }
nih_plug_egui = { path = "../../vendor/nih_plug_egui" }
parking_lot = "0.12"
realfft = "3"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
png = "0.17"
