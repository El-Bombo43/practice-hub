[package]
name = "punch"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Punch: a level-independent transient shaper"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", default-features = false, features = ["vst3"] }
nih_plug_egui = { path = "../../vendor/nih_plug_egui" }
phub_common = { path = "../../shared/common" }

[dev-dependencies]
png = "0.17"
